---
name: test
on: pull_request
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: suzuki-shunsuke/pr-unified-diff-action@v0.0.1
        id: diff
      - run: cat "$DIFF_FILE"
        env:
          DIFF_FILE: ${{ steps.diff.outputs.diff_path }}
      - uses: suzuki-shunsuke/pinact-action@pr/1065
        with:
          no_api: true
          fix: false
          diff_file: ${{ steps.diff.outputs.diff_path }}
