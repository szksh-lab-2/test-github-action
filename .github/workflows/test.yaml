---
name: test
on: pull_request
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        target:
          - foo
          - bar
    steps:
      - run: |
          if test "$TARGET" != "foo"; then
            exit 1
          fi
          sleep 5
        env:
          TARGET: ${{ matrix.target }}

  label:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [test]
    permissions: {}
    if: always()
    steps:
      - run: echo "$RESULT"
        env:
          RESULT: ${{ needs.test.result }}
