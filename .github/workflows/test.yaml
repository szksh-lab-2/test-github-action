---
name: test
on: pull_request
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    strategy:
      fail-fast: false
      matrix:
        target:
          - foo
          - bar
    outputs:
      result: ${{ matrix.target }}
    steps:
      - run: echo ""

  label:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [test]
    permissions: {}
    steps:
      - run: echo "$RESULTS"
        env:
          RESULTS: ${{ needs.test.outputs.result }}
