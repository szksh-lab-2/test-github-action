---
name: test
on: workflow_call
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - run: gh pr comment "$PR_NUMBER" -R "$GITHUB_REPOSITORY" -b hello
        env:
          GH_TOKEN: ${{github.token}}
          PR_NUMBER: ${{github.event.number}}
